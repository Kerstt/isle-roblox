name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail, so a failed curl fails the step

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rokit (pinned)
        run: |
          curl -sSfL https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools (rokit.toml)
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          rokit install --no-trust-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check (StyLua)
        run: stylua --check src

      - name: Lint (Selene)
        run: selene src

      - name: Unit tests (Lune)
        run: lune run scripts/run-tests

      - name: Build place (Rojo)
        run: rojo build default.project.json -o build.rbxl
